name: Publish Psalm 23 Transportation website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psalm-23-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run content and security tests
        run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        id: pages
      - name: Build and verify website
        run: npm run build && npm run check
        env:
          CMS_REPOSITORY: ${{ github.repository }}
          CMS_OAUTH_ORIGIN: ${{ vars.CMS_OAUTH_ORIGIN }}
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
        id: deployment
